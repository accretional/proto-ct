# Unbound config for the dnsfetch pipeline. Listens on 127.0.0.1:5353
# (no root needed), tuned for high-concurrency bulk forward lookups.
# Brought up by tools/start_dns_stack.sh.
server:
    verbosity: 0
    interface: 127.0.0.1@5353
    do-daemonize: no
    access-control: 127.0.0.1/32 allow
    chroot: ""
    username: ""
    pidfile: "/tmp/dnsfetch-unbound.pid"
    logfile: "/dev/null"
    use-syslog: no

    # Concurrency: 4 threads × 1024 in-flight = 4096 outstanding queries
    # to upstream auths. dnsfetch at workers=200 peaks around 200 × 19
    # ≈ 3800 in flight on cache misses.
    num-threads: 4
    num-queries-per-thread: 1024
    outgoing-range: 4096
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8

    # Cache sizing: we want the NS RRset for every TLD authority cached
    # after the first hit (queries 2..19 for one domain are then served
    # at one RTT to the authority instead of full recursion), plus full
    # responses for each (domain, type) pair within shard scope.
    msg-cache-size: 256m
    rrset-cache-size: 512m

    # Negative cache: dnsfetch hits a lot of NXDOMAINs on rare types.
    cache-min-ttl: 60
    cache-max-ttl: 86400
    cache-max-negative-ttl: 600

    # No DNSSEC validation (we don't consume the chain of trust) and
    # no qname minimization (extra RTTs for negligible benefit here).
    harden-dnssec-stripped: no
    val-clean-additional: no
    qname-minimisation: no

    # One-shot bulk scan — prefetch wastes work.
    prefetch: no
    prefetch-key: no

    so-rcvbuf: 4m
    so-sndbuf: 4m
    # EDNS0 UDP buffer: 1432 keeps us under typical 1500-byte Ethernet
    # MTU (avoiding IPv6 fragmentation issues that motivate the DNS
    # Flag Day 1232 default) while letting more responses fit in UDP
    # before TC=1 forces a TCP retry. With TCP fallback enabled below
    # we still recover anything that truncates anyway.
    edns-buffer-size: 1432

    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    # TCP upstream is enabled. The earlier "tcp-upstream: no" was
    # motivated by log noise from gov auths that refuse TCP — already
    # handled by logfile: /dev/null above. Without TCP fallback,
    # truncated DKIM keys, big NS RRsets, and large SVCB/HTTPS params
    # would silently drop content past the UDP buffer cutoff.
