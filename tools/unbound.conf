# Unbound config for the dnsfetch pipeline. Listens on 127.0.0.1:5353
# (no root needed), tuned for high-concurrency bulk forward lookups.
# Brought up by tools/start_dns_stack.sh.
server:
    verbosity: 0
    interface: 127.0.0.1@5353
    do-daemonize: no
    access-control: 127.0.0.1/32 allow
    chroot: ""
    username: ""
    pidfile: "/tmp/dnsfetch-unbound.pid"
    logfile: "/dev/null"
    use-syslog: no

    # Concurrency. num-threads × outgoing-range = total outbound sockets.
    # macOS kern.maxfilesperproc=61440 caps us; 6 × 8192 = 49152 + TCP +
    # listeners stays under the cap without needing sudo to raise it.
    # The 4-thread/1024 prior was thread-bound on a 10-core M4 (only ~21%
    # per thread saturation) and queue-bound on outgoing-range at the
    # 4096 ceiling. num-queries-per-thread tracks outgoing-range/2 per
    # NLnetLabs Howto Optimise.
    num-threads: 6
    num-queries-per-thread: 4096
    outgoing-range: 8192

    # Slabs: power-of-2, ≥ num-threads. 16 reduces lock contention vs 8
    # at the cost of slightly worse LRU eviction precision. Costs <1MB.
    msg-cache-slabs: 16
    rrset-cache-slabs: 16
    infra-cache-slabs: 16
    key-cache-slabs: 16

    # Cache sizing. Bulk scan is cache-miss-dominated by design, so the
    # msg-cache barely helps (we scan distinct names). The rrset-cache
    # earns its keep on shared infra (TLD glue, common NS, frequent
    # CNAME targets) which is reused heavily across distinct queries.
    # Halved both to reclaim ~700MB resident — the prior 256m+512m was
    # being eyed for compression under 16GB-class memory pressure.
    msg-cache-size: 128m
    rrset-cache-size: 256m

    # Per-auth-server RTT and EDNS state cache. Default 10000 was almost
    # certainly churning — bulk scan touches >10K distinct authoritative
    # nameservers across com/net/org. LRU eviction means re-probing for
    # RTT and EDNS support, costing extra roundtrips that don't show in
    # any rate metric.
    infra-cache-numhosts: 100000

    # Negative cache: dnsfetch hits a lot of NXDOMAINs on rare types.
    # The application also early-exits on NXDOMAIN-A (RFC 2308) so the
    # resolver-side negative cache mostly helps for NODATA (NOERROR
    # empty answer) cases.
    cache-min-ttl: 60
    cache-max-ttl: 86400
    cache-max-negative-ttl: 600

    # No DNSSEC validation (we don't consume the chain of trust) and
    # no qname minimization (extra RTTs for negligible benefit here).
    harden-dnssec-stripped: no
    val-clean-additional: no
    qname-minimisation: no

    # RFC 8198 — synthesise NXDOMAIN from cached NSEC ranges. Gold for
    # DNSSEC-signed TLDs (.com, .net, .gov) with many nonexistent names.
    aggressive-nsec: yes

    # One-shot bulk scan — prefetch wastes work.
    prefetch: no
    prefetch-key: no

    # TCP slot pools: default 10 is too low for bulk scanning when TCP
    # fallback fires (truncated NS/SVCB/HTTPS/large TXT). Per-thread.
    incoming-num-tcp: 100
    outgoing-num-tcp: 100

    # Keep outgoing UDP sockets open briefly after answer to absorb
    # late duplicates and avoid ICMP port-unreachable amplification at
    # high churn rates. Material at our concurrency.
    delay-close: 10000

    # Cheap spoof-detection threshold (NLnetLabs-suggested).
    unwanted-reply-threshold: 10000000

    # Trim response size where safe; fewer TC=1 → fewer TCP fallbacks.
    minimal-responses: yes

    so-rcvbuf: 4m
    so-sndbuf: 4m
    # EDNS0 UDP buffer: 1432 keeps us under typical 1500-byte Ethernet
    # MTU (avoiding IPv6 fragmentation issues that motivate the DNS
    # Flag Day 1232 default) while letting more responses fit in UDP
    # before TC=1 forces a TCP retry. With TCP fallback enabled below
    # we still recover anything that truncates anyway.
    edns-buffer-size: 1432

    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    # TCP upstream is enabled. The earlier "tcp-upstream: no" was
    # motivated by log noise from gov auths that refuse TCP — already
    # handled by logfile: /dev/null above. Without TCP fallback,
    # truncated DKIM keys, big NS RRsets, and large SVCB/HTTPS params
    # would silently drop content past the UDP buffer cutoff.

remote-control:
    # Enable unbound-control for runtime stats. Unix socket on /tmp so
    # we don't need certs and don't open another listener port.
    control-enable: yes
    control-interface: /tmp/dnsfetch-unbound.sock
    control-use-cert: no
