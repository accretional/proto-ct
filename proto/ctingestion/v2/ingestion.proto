syntax = "proto3";

package ctingestion.v2;

option go_package = "github.com/accretional/proto-ct/gen/ctingestion/v2";

import "ctingestion/v2/log_list.proto";

// CTIngestionService (v2) is a stateless, range-addressable raw-leaf archiver.
//
// Unlike v1 (which parsed certs into tld-sharded SQLite behind a single writer),
// v2 fetches a half-open entry range [start_index, end_index) from ONE log and
// persists the Merkle tree leaves verbatim to disk as a base layer. All cert /
// subject extraction is deferred to later tools. A job is a pure unit of work an
// orchestrator can fan out across hosts and ranges — no shared writer, no merge.
service CTIngestionService {
  // GetLogEntries fetches [start_index, end_index) from the selected log and
  // writes the raw leaves to disk (partitioned by leaf timestamp + index range),
  // returning a manifest of what was written. (A streaming-progress variant may
  // be added later.)
  rpc GetLogEntries(GetLogEntriesRequest) returns (GetLogEntriesResponse);

  // GetLogList returns the current CT log catalogue (default: Google's gstatic
  // v3 log_list.json), mapped into CTLogList.
  rpc GetLogList(GetLogListRequest) returns (CTLogList);

  // GetSTH returns the current signed tree head / checkpoint of the target log.
  rpc GetSTH(GetSTHRequest) returns (STHResponse);

  // CheckCoverage reports how much of a single log has been fetched to disk
  // under output_root, derived entirely from the stored partition files (their
  // filenames encode the index ranges) — no progress DB. Optionally queries the
  // log's current STH to report coverage_pct and gaps against the live tree.
  rpc CheckCoverage(CheckCoverageRequest) returns (CheckCoverageResponse);

  // ResolveIssuers populates the local content-addressed issuer store
  // (<output_root>/issuers/<hex>.der) for a STATIC-CT-API log so it matches the
  // RFC 6962 storage pattern. Static records keep only chain_fingerprints (the
  // chain certs live at the log's issuer/<hash> endpoint); this scans the stored
  // entries, fetches each referenced-but-missing chain cert, verifies its SHA-256
  // == fingerprint, and writes it once. Idempotent and rerunnable (a no-op once
  // every issuer is present). After it runs, chains validate fully offline for
  // both source types.
  rpc ResolveIssuers(ResolveIssuersRequest) returns (ResolveIssuersResponse);
}

enum EntryType {
  ENTRY_TYPE_UNSPECIFIED = 0;
  ENTRY_TYPE_X509 = 1;
  ENTRY_TYPE_PRECERT = 2;
}

enum PartitionGranularity {
  PARTITION_GRANULARITY_UNSPECIFIED = 0; // server treats as DAY
  PARTITION_GRANULARITY_DAY = 1;
  PARTITION_GRANULARITY_HOUR = 2;
}

// Compression applied to the partition .binpb files (the issuer store is left
// uncompressed — see the `compression` field). When enabled the on-disk partition
// name gains a ".gz" suffix.
enum Compression {
  COMPRESSION_UNSPECIFIED = 0; // server treats as NONE
  COMPRESSION_NONE = 1;
  COMPRESSION_GZIP = 2;
}

// LogSelector identifies the target log. Either set `log_id` (resolved against
// the server's cached log list, which supplies url/protocol/key) OR set
// `monitoring_url` + `protocol` explicitly (+ `public_key` for static logs,
// needed to verify the checkpoint).
message LogSelector {
  bytes log_id = 1;
  string monitoring_url = 2;
  LogProtocol protocol = 3;
  bytes public_key = 4; // DER SubjectPublicKeyInfo
}

message GetLogEntriesRequest {
  LogSelector log = 1;
  int64 start_index = 2;
  int64 end_index = 3; // exclusive

  // Tuning knobs, exposed to the extent the underlying client allows.
  double target_qps = 4;       // 0 = unlimited
  int32 fetch_concurrency = 5; // parallel in-flight fetches; 0 = default
  int32 page_size = 6;         // get-entries request size hint; 0 = provider max
  string user_agent = 7;       // default: proto-ct (ct@accretional.com, +https://accretional.com)

  string output_root = 8;                 // base dir for written partitions
  PartitionGranularity granularity = 9;    // default DAY
  bool verify = 10;                        // verify checkpoint/inclusion (default off for raw reads)

  // Close the connection after each HTTP request (no keep-alive). DigiCert runs
  // N Nginx servers per shard, each limited to ~1 req/s, and a persistent
  // connection pins to one server; closing connections lets the load balancer
  // re-roll requests across all servers (rfc6962 path). Costs a TLS handshake
  // per request, so leave off for fast logs; on for DigiCert. Default: off.
  bool disable_keep_alive = 11;

  // Compress the partition files with gzip (.binpb -> .binpb.gz). RFC6962 chains
  // were already deduped into the issuer store (O1), so the leaf files are mostly
  // leaf-cert DER; gzip still trims them ~2.2x. The issuer store is NOT compressed
  // (small DER certs barely shrink, and raw files keep the content-address
  // invariant sha256(<hex>.der) == fingerprint). Default (unspecified) = NONE.
  // (Storage opt O4.)
  Compression compression = 12;
}

message GetLogEntriesResponse {
  int64 entries_written = 1;
  int64 bytes_written = 2;  // uncompressed logical size of written records; on-disk is smaller when compression is set
  int64 first_index = 3;
  int64 last_index = 4;
  // A per-partition manifest was intentionally removed: large ranges produce
  // tens of thousands of partitions and the response would exceed gRPC's message
  // limit. Enumerate partitions from disk via CheckCoverage instead.
  reserved 5;
  reserved "partitions";
}

// RawLogEntry is the unified raw record persisted to disk (as binary protobuf,
// in RawLogEntryBatch files). After storage opts O1+O2+O3 both protocols converge
// on one minimal shape: `leaf_input` (the canonical TLS-encoded MerkleTreeLeaf,
// which embeds the leaf cert / TBSCertificate) + `chain_fingerprints` (+ precert
// fields). The issuer chain is NOT stored inline; each leaf keeps only SHA-256
// fingerprints, and the actual chain certs live once in a shared, content-
// addressed issuer store (`<output_root>/issuers/<hex>.der` for RFC 6962, or the
// log's own `issuer/<hash>` endpoint for static-ct-api). `source` records which
// protocol produced the record.
message RawLogEntry {
  int64 index = 1;
  int64 timestamp_ms = 2;
  EntryType entry_type = 3;
  LogProtocol source = 4;

  bytes leaf_input = 5;  // TLS-encoded MerkleTreeLeaf (verbatim for RFC 6962, reconstructed for static)

  // Field 6 (`extra_data`) was removed (storage opt O1): RFC 6962 carried the
  // entire issuer chain as DER here (~3.9 KB/entry, ~79% of the record, mostly
  // duplicate CA certs). The chain is now stored as `chain_fingerprints` + a
  // shared issuer store, dropping RFC 6962 records from ~5 KB to ~1-1.5 KB. The
  // full submitted precertificate (the only part of extra_data not derivable from
  // leaf_input) is preserved in `precertificate`.
  reserved 6;
  reserved "extra_data";

  // Field 7 (`certificate`) was removed (storage opt O2): the leaf cert DER /
  // TBSCertificate is already embedded in `leaf_input` (the reconstructed
  // MerkleTreeLeaf), so populating it duplicated ~1.4 KB/entry (~half the static
  // record). Downstream tools parse the cert out of `leaf_input` instead.
  reserved 7;
  reserved "certificate";
  bytes precertificate = 8;       // full submitted precert (precerts only; not in leaf_input)
  bytes issuer_key_hash = 9;      // precert issuer key hash (precerts only)
  repeated bytes chain_fingerprints = 10; // SHA-256 of each issuer-chain cert; resolve via the issuer store
}

message LogMeta {
  bytes log_id = 1;
  string monitoring_url = 2;
  LogProtocol protocol = 3;
}

// RawLogEntryBatch is the payload of a single on-disk partition file.
message RawLogEntryBatch {
  LogMeta log = 1;
  repeated RawLogEntry entries = 2;
}

message GetLogListRequest {
  string log_list_url = 1; // empty = gstatic v3 log_list.json
}

message GetSTHRequest {
  LogSelector log = 1;
}

message STHResponse {
  bytes log_id = 1;
  int64 tree_size = 2;
  int64 timestamp = 3;          // epoch ms
  bytes sha256_root_hash = 4;
  bytes tree_head_signature = 5;
}

// IndexRange is a half-open entry-index range [start, end).
message IndexRange {
  int64 start = 1; // inclusive
  int64 end = 2;   // exclusive
}

message CheckCoverageRequest {
  // The log selector is only needed when query_sth is set (to fetch the STH;
  // resolved via the log list when only log_id is given). The disk scan does not
  // use it — output_root is a single log's prefix.
  LogSelector log = 1;
  string output_root = 2;  // a single log's output prefix, scanned recursively
  bool query_sth = 3;      // fetch current STH -> tree_size + coverage_pct + gaps vs live tree
  bool include_gaps = 4;   // return missing index ranges (for resume planning)
}

message CheckCoverageResponse {
  int64 tree_size          = 1; // from STH if query_sth, else 0
  int64 stored_entries     = 2; // total entries on disk (sum of stored ranges)
  int64 frontier           = 3; // highest stored index + 1 (0 if nothing stored)
  int64 contiguous_through = 4; // largest N such that [0, N) is fully stored
  double coverage_pct      = 5; // stored_entries / tree_size * 100 (0 if tree_size unknown)
  int64 partition_files    = 6; // number of .binpb files counted
  // Missing index ranges, only populated when include_gaps. Bounded by tree_size
  // when query_sth (so the tail [frontier, tree_size) is included), else by frontier.
  repeated IndexRange gaps = 7;
  // Set when query_sth was requested but the STH fetch failed (e.g. the log
  // rate-limited us). The disk-derived fields are still valid; tree_size is 0 and
  // coverage_pct/tail gap are omitted.
  string sth_error = 8;
}

message ResolveIssuersRequest {
  // The selector is only used to recover the log's monitoring URL when it is not
  // already recorded in the stored batches (it normally is). The disk scan and
  // store writes use output_root alone.
  LogSelector log = 1;
  string output_root = 2;       // the static log's output prefix to scan + populate
  double target_qps = 3;        // throttle issuer fetches; 0 = unlimited
  int32 fetch_concurrency = 4;  // parallel issuer fetches; 0 = default (8)
  string user_agent = 5;
  bool dry_run = 6;             // only report what's missing; fetch nothing
}

message ResolveIssuersResponse {
  int64 referenced     = 1; // distinct chain fingerprints referenced by static entries
  int64 already_present = 2; // of those, already in the local issuer store
  int64 fetched        = 3; // newly fetched, verified, and stored (0 on dry_run)
  int64 failed         = 4; // fetch/verify failures
  // A bounded sample of failures ("<hex fingerprint>: <reason>") for debugging.
  repeated string errors = 5;
}
