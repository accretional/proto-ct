syntax = "proto3";

package ctingestion.v1;

option go_package = "github.com/benfultz/proto-ct/gen/ctingestion/v1";

service CTIngestionService {
  // IngestLog downloads CT log tiles, writes to SQLite, and streams parsed subjects.
  rpc IngestLog(IngestRequest) returns (stream SubjectRecord);
  // IngestAll ingests from every CT log in the supplied log_list.json (server
  // pulls https://www.gstatic.com/ct/log_list/v3/log_list.json by default),
  // fanning out one worker per usable log. Streams LogProgress events instead
  // of per-subject records — for low-volume per-log heartbeat in a TUI.
  rpc IngestAll(IngestAllRequest) returns (stream LogProgress);
  // Check returns current ingestion metrics (tree size, coverage, DB sizes).
  rpc Check(CheckRequest) returns (CheckResponse);
}

// IngestRequest specifies a CT log mirroring job.
message IngestRequest {
  // Base URL of the tile/data endpoint.
  // e.g. "https://mon.sycamore.ct.letsencrypt.org/2026h1/tile/data/"
  string monitoring_api_root = 1;
  // Number of log entries to mirror this session.
  int64 batch_size = 2;
  // Active staging directory (fast local storage). Dated YYYYMMDD subdirs are
  // written here during ingestion and promoted to archive_dir on daily rollover.
  string output_dir = 3;
  // Target maximum QPS to the monitoring endpoint. Actual rate is ~80% of this.
  // 0 = unlimited.
  double target_qps = 4;
  // Persistent archive directory (durable storage). Receives completed dated dirs
  // on rollover. progress.db always lives here.
  string archive_dir = 5;
  // Roll over the active subjects.db to the archive drive whenever its size
  // (main file + WAL) reaches this threshold. 0 = disabled.
  int64 size_rollover_bytes = 6;
}

// SubjectRecord is streamed back for each mirrored certificate subject.
message SubjectRecord {
  string url                 = 1;
  string common_name         = 2;
  string organization        = 3;
  string state               = 4;
  string country             = 5;
  int64  ca_id               = 6;
  repeated string san_domains = 7;
  string not_before          = 8;
  string not_after           = 9;
  string issuer_common_name  = 10;
  string issuer_organization = 11;
  string issuer_country      = 12;
  string serial_number       = 13;
  string ct_log_uri          = 14;
}

// CheckRequest selects which mirror to inspect.
// If fields are empty the server uses values from the most recent IngestLog call.
message CheckRequest {
  string output_dir          = 1;  // active staging dir
  string monitoring_api_root = 2;
  string archive_dir         = 3;  // persistent archive dir (for progress.db + old dated dirs)
}

// CheckResponse carries current mirroring progress and storage metrics.
message CheckResponse {
  int64  tree_size        = 1;  // total entries in the live CT log
  int64  total_processed  = 2;  // entries mirrored so far
  double coverage_pct     = 3;  // total_processed / tree_size * 100
  int64  db_bytes_total   = 4;  // combined size of all local SQLite files
  string updated_at       = 5;  // RFC3339 timestamp of this snapshot
  repeated DbInfo db_files = 6; // per-file breakdown
}

// DbInfo describes a single SQLite file on disk.
message DbInfo {
  string path        = 1;
  int64  size_bytes  = 2;
}

// IngestAllRequest configures a fan-out ingest across many CT logs.
message IngestAllRequest {
  // Where to fetch the log catalog. Empty = Google's gstatic v3 list.
  string log_list_url = 1;
  // Filter by protocol. Empty = both ("static-ct-api", "rfc6962").
  repeated string protocols = 2;
  // Filter by operator name. Empty = all operators.
  repeated string operators = 3;
  // Optional substring match on log description (e.g. "2026h1"). Empty = no filter.
  string description_contains = 4;
  // Per-log target QPS. 0 = use protocol default (Google 25, others 10).
  double per_log_qps = 5;
  // Entries-per-log cap for this session. 0 = run until caught up.
  int64 batch_size_per_log = 6;
  // Active staging directory (fast local storage).
  string output_dir = 7;
  // Persistent archive directory (durable storage).
  string archive_dir = 8;
  // Emit a LogProgress event every N entries per log. 0 = default (10_000).
  int64 progress_every = 9;
}

// LogProgress is a per-log heartbeat streamed during IngestAll.
message LogProgress {
  bytes  log_id              = 1;   // canonical SHA-256(SPKI), 32 bytes
  string description         = 2;
  string operator            = 3;
  string protocol            = 4;   // "static-ct-api" | "rfc6962"
  int64  entries_processed   = 5;   // session-local count
  int64  total_processed     = 6;   // cumulative across sessions
  int64  next_entry_idx      = 7;
  int64  tree_size           = 8;   // live tree size when known
  string status              = 9;   // "running" | "caught_up" | "error" | "complete"
  string error               = 10;  // populated when status == "error"
  string updated_at          = 11;  // RFC3339
}
